# templates.toml — synthetic Norwegian clinical text templates for ConText evaluation.
#
# Schema per template:
#   id           = unique string identifier
#   pattern      = text with {entity} and optional {entity2} slots; trigger word/phrase
#                  is embedded literally in the pattern text.
#   gold_context = one of: NEGATED_EXISTENCE, POSSIBLE_EXISTENCE, HYPOTHETICAL,
#                  HISTORICAL, FAMILY, AFFIRMED
#   trigger      = the exact cue phrase present in pattern (for meta field)
#   section      = clinical section label (plain name, not the heading literal)
#   multi_span   = true if record encodes two spans (conjunction traps)
#   entity2_gold = gold_context for the second span (only when multi_span = true)
#
# Source citations:
#   [Skeppstedt 2011] Skeppstedt M., "Negation detection in Swedish clinical text:
#       An adaption of NegEx to Swedish", J. Biomed. Semantics 2(Suppl 3):S3.
#       Norwegian candidates ported via docs/SEEDS.md NO-CANDIDATES table.
#   [Tromsø 2018]   Budrionis et al., UNN/DSV poster — rule counts + examples.
#   [medspacy-no SEEDS] docs/SEEDS.md — author-proposed Norwegian cues with
#       physician-review flags preserved.

# ──────────────────────────────────────────────
