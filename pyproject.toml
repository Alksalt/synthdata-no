[project]
name = "synthdata-no"
version = "0.1.0"
description = "Deterministic generator of synthetic Norwegian health data (Tenor-range IDs, bokmål clinical text, no-basis FHIR R4B)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Oleksandr Altukhov" }]
keywords = ["synthetic-data", "norway", "health", "fhir", "fnr"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "faker>=25.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
