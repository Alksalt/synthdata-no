[project]
name = "synthdata-no"
version = "0.1.0"
description = "Deterministic generator of synthetic Norwegian health data (Tenor-range IDs, bokmål clinical text, no-basis FHIR R4B)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Oleksandr Altukhov" }]
keywords = ["synthetic-data", "norway", "health", "fhir", "fnr"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "faker>=25.0,<26",
    "defusedxml>=0.7.1",
    "fhir-resources>=8",
    "fhir-validator>=0.2.2",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "click>=8.1",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8"]

[dependency-groups]
dev = [
    "requests>=2.32",  # scripts/ regen only — not a runtime dep
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "spacy>=3.8.14",
]

[project.scripts]
synthdata-no = "synthdata_no.cli:cli"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: consumer integration smoke tests (runnable offline)",
]
